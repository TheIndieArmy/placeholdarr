version: "3.8"
services:
  placeholdarr:
    image: ghcr.io/theindiearmy/placeholdarr:queue_monitoring-latest
    env_file:
      - .env
    volumes:
  # Update these paths to match your actual placeholder library locations and dummy files
  # Mount your movie placeholder folder (MOVIE_LIBRARY_FOLDER)
  # IMPORTANT: For Plex/Tautulli compatibility, mount the host path to the SAME absolute path inside the container.
  # Example: - /mnt/plex/Movies/placeholders:/mnt/plex/Movies/placeholders
  - /path/to/your/movie-library:/path/to/your/movie-library
  # Mount your TV placeholder folder (TV_LIBRARY_FOLDER)
  - /path/to/your/tv-library:/path/to/your/tv-library
  # Uncomment the following lines if using 4K placeholder libraries:
  # - /path/to/your/movie-library-4k:/path/to/your/movie-library-4k  # MOVIE_LIBRARY_4K_FOLDER
  # - /path/to/your/tv-library-4k:/path/to/your/tv-library-4k        # TV_LIBRARY_4K_FOLDER
  # Mount your standard dummy file
  - /path/to/your/dummy.mp4:/path/to/your/dummy.mp4
  # Mount your "coming soon" dummy file (optional)
  - /path/to/your/coming_soon_dummy.mp4:/path/to/your/coming_soon_dummy.mp4
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
# IMPORTANT:
# For Plex/Tautulli compatibility, the left and right side of each volume mount must be the SAME absolute host path.
# Your .env file paths must match this host path, and the container must see the same path as the host.
# Example:
#   - /mnt/plex/Movies/placeholders:/mnt/plex/Movies/placeholders
#   - /mnt/plex/TV/placeholders:/mnt/plex/TV/placeholders
# This ensures Placeholdarr can match the path sent by Tautulli.
