version: "3.8"
services:
  placeholdarr:
    build:
      context: .
      dockerfile: dockerfile
    container_name: placeholdarr
    env_file:
      - .env
    environment:
      APPDATA_PATH: /config
      LOG_DIR: /config/logs
      DB_HOST: placeholdarr_postgres
      DB_PORT: 5432
      DB_USER: placeholdarr
      DB_PASS: placeholdarr
      DB_NAME: placeholdarr
    volumes:
      # Placeholdarr app state + logs + Postgres data root
      - ${PLACEHOLDARR_APPDATA:-./.appdata}:/config
      # Update these paths to match your actual placeholder library locations
      - /path/to/your/movie-library:/movies
      - /path/to/your/tv-library:/tv
      # Uncomment the following lines if using 4K placeholder libraries:
      # - /path/to/your/movie-library-4k:/movies-4k  # MOVIE_LIBRARY_4K_FOLDER
      # - /path/to/your/tv-library-4k:/tv-4k        # TV_LIBRARY_4K_FOLDER
      # Optional dummy files (match DUMMY_FILE_PATH / COMING_SOON_DUMMY_FILE_PATH)
      - ./dummy.mp4:/data/dummy.mp4
      - ./coming_soon_dummy.mp4:/data/coming_soon_dummy.mp4
    ports:
      - "8000:8000"
    restart: unless-stopped

  placeholdarr_postgres:
    container_name: placeholdarr_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "placeholdarr"
      POSTGRES_PASSWORD: "placeholdarr"
      POSTGRES_DB: "placeholdarr"
    volumes:
      - ${PLACEHOLDARR_APPDATA:-./.appdata}/postgres:/var/lib/postgresql/data
