services:
  placeholdarr:
    image: ghcr.io/theindiearmy/placeholdarr:main-db-latest
    container_name: placeholdarr
    depends_on:
      placeholdarr_postgres:
        condition: service_healthy
    environment:
      DB_HOST: placeholdarr_postgres
      DB_PORT: 5432
      DB_USER: placeholdarr
      DB_PASS: placeholdarr
      DB_NAME: placeholdarr
    volumes:
      # Map host appdata to /config inside the container (default app state + logs path).
      - ${PLACEHOLDARR_APPDATA:-./.appdata}:/config
      # Placeholder/media root mapping used by onboarding/settings path fields.
      - /path/to/your/data/placeholdarr:/placeholdarr
    ports:
      - "8000:8000"
    restart: unless-stopped

  placeholdarr_postgres:
    container_name: placeholdarr_postgres
    image: docker.io/library/postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placeholdarr -d placeholdarr"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      POSTGRES_USER: "placeholdarr"
      POSTGRES_PASSWORD: "placeholdarr"
      POSTGRES_DB: "placeholdarr"
    volumes:
      - ${PLACEHOLDARR_APPDATA:-./.appdata}/postgres:/var/lib/postgresql
