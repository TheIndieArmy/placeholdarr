services:
  placeholdarr: 
    container_name: placeholdarr
    image: !reset null
    build: !override
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    volumes: !override
      - debridmedia_mnt:/mnt
      - /opt/placeholdarr/logs:/logs
    ports: !override
      - "127.0.0.1:18843:8000"
    restart: !override always
  
  placeholdarr_postgres:
    container_name: placeholdarr_postgress
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: "placeholdarr"
      POSTGRES_PASSWORD: "placeholdarr"
      POSTGRES_DB: "placeholdarr"
    volumes:
      - /opt/placeholdarr/data:/var/lib/postgresql/data
    # ports:
      # - "127.0.0.1:5432:5432"

networks:
  default:
    name: shared_network
    external: true

volumes:
  debridmedia_mnt:
    external: true
